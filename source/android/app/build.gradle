apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    debuggableVariants = ["debug"]
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.sports"

    defaultConfig {
        applicationId "com.sports"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        // Prefer arm64 for faster local builds; cmake still targets needed ABIs
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -frtti -fexceptions"
                abiFilters 'arm64-v8a'
                arguments "-DCMAKE_OBJECT_PATH_MAX=100",
                          "-DCMAKE_USE_RELATIVE_PATHS=TRUE",
                          "-DANDROID_LD=lld",
                          "-DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF",
                          "-DCMAKE_INTERPROCEDURAL_OPTIMIZATION_DEBUG=OFF"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
            buildStagingDirectory file("C:/b/cxx")
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    // OpenCV from Maven Central via :opencv module (no local AAR in git)
    implementation project(':opencv')

    // MediaPipe Tasks Vision ΓÇö fully offline, bundles its own inference runtime
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'

    // SQLCipher ΓÇö encrypted SQLite
    implementation 'net.zetetic:android-database-sqlcipher:4.5.4'
    implementation 'androidx.sqlite:sqlite:2.4.0'

    // WorkManager ΓÇö background sync
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation 'io.github.react-native-community:jsc-android:2026004.+'
    }
}

configurations.all {
    resolutionStrategy {
        force "androidx.media3:media3-database:1.8.0"
        force "androidx.media3:media3-datasource:1.8.0"
        force "androidx.media3:media3-datasource-okhttp:1.8.0"
        force "androidx.media3:media3-decoder:1.8.0"
        force "androidx.media3:media3-exoplayer:1.8.0"
        force "androidx.media3:media3-exoplayer-dash:1.8.0"
        force "androidx.media3:media3-exoplayer-hls:1.8.0"
        force "androidx.media3:media3-exoplayer-smoothstreaming:1.8.0"
        force "androidx.media3:media3-extractor:1.8.0"
        force "androidx.media3:media3-session:1.8.0"
        force "androidx.media3:media3-ui:1.8.0"
    }
}
