name: CI

on:
  pull_request:

jobs:

  backend:

    name: Backend

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Start API and verify health check
        run: |
          npm start > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

  mobile:

    name: React Native

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: source

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
          cache: npm
          cache-dependency-path: source/package-lock.json

      - run: npm ci

      - name: Load Metro configuration
        run: node -e "require('./metro.config.js')"
